name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MAX_BYTES: 15728640

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-22.04, not -latest: a binary linked against glibc 2.39 refuses to run on
        # distributions still on 2.35 (Ubuntu 22.04, Debian 12), which the release must support.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No telemetry feature in a published binary (SPEC.md §3.4): the release
      # must not be able to send anything, even with SENTRY_DSN in the environment.
      - run: cargo build --release --locked --no-default-features
      - name: Size gate
        shell: bash
        run: |
          binary=target/release/apc
          [ -f "$binary" ] || binary="$binary.exe"
          size=$(wc -c < "$binary")
          echo "$binary: $size bytes (budget $MAX_BYTES)"
          test "$size" -lt "$MAX_BYTES"
      - name: Package
        shell: bash
        run: |
          name="apc-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "dist/$name"
          binary=target/release/apc
          [ -f "$binary" ] || binary="$binary.exe"
          cp "$binary" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            (cd dist && tar czf "$name.tar.gz" "$name")
          fi
          (cd dist && sha256sum "$name".* > "$name.sha256" 2>/dev/null || shasum -a 256 "$name".* > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: apc-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
