[package]
name = "apc-decision"
description = "Local decision layer: Permission Guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Talks to a local-jev sidecar instead of the built-in heuristics (SPEC.md §8.1, §8.11).
open-jev = ["dep:reqwest", "dep:serde_json"]

[dependencies]
apc-core.workspace = true
apc-traits.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
