[package]
name = "apc-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Aplix Code desktop client: one window over the local `apc serve` API."

# Not a member of the root workspace: GTK/WebKit only enter the graph here, so `cargo test
# --workspace` and CI's three-OS release keep working without installing desktop libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "5"
tauri = { version = "2", features = [] }
