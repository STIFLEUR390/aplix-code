[package]
name = "apc-cli"
description = "The apc binary — composition root for every layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "apc"
path = "src/main.rs"

[features]
# Dev phase: Sentry is compiled in. The v1.0 release task flips this to `[]`.
default = ["telemetry"]
telemetry = ["dep:sentry"]

[dependencies]
apc-core.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
sentry = { workspace = true, optional = true }
toml.workspace = true
