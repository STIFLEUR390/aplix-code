[package]
name = "apc-cli"
description = "The apc binary — composition root for every layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "apc"
path = "src/main.rs"

[features]
# Dev phase: Sentry is compiled in. The v1.0 release task flips this to `[]`.
default = ["telemetry"]
telemetry = ["dep:sentry"]
# Ask a local-jev sidecar before the heuristics (SPEC.md §8.11).
open-jev = ["apc-decision/open-jev"]

[dependencies]
apc-agent.workspace = true
apc-core.workspace = true
apc-decision.workspace = true
apc-memory.workspace = true
apc-models.workspace = true
apc-plugins.workspace = true
apc-traits.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
sentry = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
