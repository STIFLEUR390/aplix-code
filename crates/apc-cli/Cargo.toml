[package]
name = "apc-cli"
description = "The apc binary — composition root for every layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "apc"
path = "src/main.rs"

[features]
# Telemetry is opt-in at build time: a released binary carries no Sentry code at all.
# Keep testing it with `cargo test --features telemetry`.
default = []
telemetry = ["dep:sentry"]
# Ask a local-jev sidecar before the heuristics (SPEC.md §8.11).
open-jev = ["apc-decision/open-jev"]

[dependencies]
apc-agent.workspace = true
apc-core.workspace = true
apc-decision.workspace = true
apc-memory.workspace = true
apc-models.workspace = true
apc-plugins.workspace = true
apc-traits.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
crossterm.workspace = true
directories.workspace = true
futures-util.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sentry = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
