[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/STIFLEUR390/aplix-code"
authors = ["STIFLEUR390"]

[workspace.dependencies]
apc-core = { path = "crates/apc-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
thiserror = "2"
toml = "0.8"

# SPEC.md §6: latency first, size from strip/lto/abort.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
