[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/STIFLEUR390/aplix-code"
authors = ["STIFLEUR390"]

[workspace.dependencies]
apc-core = { path = "crates/apc-core", version = "0.1.0" }
apc-decision = { path = "crates/apc-decision", version = "0.1.0" }
apc-agent = { path = "crates/apc-agent", version = "0.1.0" }
apc-memory = { path = "crates/apc-memory", version = "0.1.0" }
apc-models = { path = "crates/apc-models", version = "0.1.0" }
apc-plugins = { path = "crates/apc-plugins", version = "0.1.0" }
apc-tools = { path = "crates/apc-tools", version = "0.1.0" }
apc-traits = { path = "crates/apc-traits", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
futures-core = "0.3"
futures-util = "0.3"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

# SPEC.md §6: latency first, size from strip/lto/abort.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
