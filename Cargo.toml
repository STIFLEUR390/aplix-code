[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/STIFLEUR390/aplix-code"
authors = ["STIFLEUR390"]

[workspace.dependencies]
apc-core = { path = "crates/apc-core", version = "1.0.0" }
apc-decision = { path = "crates/apc-decision", version = "1.0.0" }
apc-agent = { path = "crates/apc-agent", version = "1.0.0" }
apc-memory = { path = "crates/apc-memory", version = "1.0.0" }
apc-models = { path = "crates/apc-models", version = "1.0.0" }
apc-plugins = { path = "crates/apc-plugins", version = "1.0.0" }
apc-tools = { path = "crates/apc-tools", version = "1.0.0" }
apc-traits = { path = "crates/apc-traits", version = "1.0.0" }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
futures-core = "0.3"
futures-util = "0.3"
ratatui = "0.29"
rs-trafilatura = "0.2"
# bundled: sqlite is compiled in, so the CLI keeps its "no system dependency" promise
# (SPEC.md §6) and an offline `apc` needs no distro package.
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
# rustls-no-provider, not rustls: the latter hard-codes aws-lc-rs, whose C sources
# reference glibc 2.38 symbols and refuse to link on Ubuntu 22.04 (the release
# runner). ring is the provider instead, installed once in apc-cli's main.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls-no-provider",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
  "tracing",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"

# SPEC.md §6: latency first, size from strip/lto/abort.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
